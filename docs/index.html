                "均值": [38.0694],
                "中位数": [38.0634],
                "标准差": [2.912],
                "偏度": [-0.0726],
                "峰度": [2.8412]
            },
            "超市贸零售价格": {
                "最大值": [51.8253],
                "最小值": [39.6687],
                "均值": [45.9166],
                "中位数": [45.6411],
                "标准差": [3.647],
                "偏度": [-0.0992],
                "峰度": [1.5614]
            }
        };

        const priceTypes = ['wholesale', 'trade', 'supermarket'];
        const priceNames = {
            wholesale: '批发价格',
            trade: '批农贸零售价格',
            supermarket: '超市贸零售价格'
        };
        const jsonKeys = {
            wholesale: '批发价格',
            trade: '批农贸零售价格',
            supermarket: '超市贸零售价格'
        };

        function createStatsTable(stats, containerId) {
            const container = document.getElementById(containerId);
            if (!stats) return;

            let html = `
                <div class="card">
                    <div class="card-header">描述性统计分析</div>
                    <div class="card-body">
                        <table class="table table-bordered stats-table">
                            <thead><tr><th>统计指标</th><th>数值</th></tr></thead>
                            <tbody>`;
            for (const [key, value] of Object.entries(stats)) {
                html += `<tr><td>${key}</td><td>${typeof value === 'number' ? value.toFixed(2) : value[0].toFixed(4)}</td></tr>`;
            }
            html += `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function createTimeSeriesChart(data, containerId, priceKey) {
            const container = document.getElementById(containerId);
            const chartId = 'chart_' + containerId;

            let html = `<div class="card">
                <div class="card-header">${priceNames[priceKey]}时序变化</div>
                <div class="card-body">
                    <div class="chart-container"><canvas id="${chartId}"></canvas></div>
                    <p class="text-muted text-center">数据来源: 鲜羊肉价格数据</p>
                </div>
            </div>`;
            container.innerHTML = html;

            // 根据价格类型获取对应的数据
            let priceField;
            if (priceKey === 'wholesale') {
                priceField = '批发价格';
            } else if (priceKey === 'trade') {
                priceField = '批农贸零售价格';
            } else {
                priceField = '超市贸零售价格';
            }

            const prices = data.map(item => item[priceField]);
            const dates = data.map(item => item.日期_str || item.日期);

            // 确保Canvas元素存在
            const canvas = document.getElementById(chartId);
            if (!canvas) {
                console.error('Canvas元素不存在:', chartId);
                return;
            }

            // 确保Chart.js加载
            if (typeof Chart === 'undefined') {
                console.error('Chart.js未加载');
                return;
            }

            try {
                new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: `${priceNames[priceKey]} (元/公斤)`,
                            data: prices,
                            borderColor: '#1f77b4',
                            backgroundColor: 'rgba(31, 119, 180, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: `${priceNames[priceKey]}时序变化`, font: { size: 16, weight: 'bold' } }
                        },
                        scales: {
                            x: { title: { display: true, text: '时间' } },
                            y: { title: { display: true, text: '价格 (元/公斤)' } }
                        }
                    }
                });
                console.log('图表创建成功:', priceKey);
            } catch (error) {
                console.error('创建图表失败:', error);
            }
        }

        function createModelInfo(containerId) {
            const container = document.getElementById(containerId);
            let html = `
                <div class="card">
                    <div class="card-header">SARIMA模型构建与最优定阶</div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <p>模型信息将在这里显示</p>
                        </div>
                    </div>
                </div>`;
            container.innerHTML = html;
        }

        function createEvalTable(containerId) {
            const container = document.getElementById(containerId);
            let html = `
                <div class="card">
                    <div class="card-header">模型效果评价指标对比</div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <p>模型评估结果将在这里显示</p>
                        </div>
                    </div>
                </div>`;
            container.innerHTML = html;
        }

        function createForecastTable(containerId) {
            const container = document.getElementById(containerId);
            let html = `
                <div class="card">
                    <div class="card-header">未来6个月价格预测表</div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <p>预测结果将在这里显示</p>
                        </div>
                    </div>
                </div>`;
            container.innerHTML = html;
        }

        function init() {
            console.log('开始初始化...');
            
            priceTypes.forEach(priceType => {
                console.log('处理价格类型:', priceType);
                const key = jsonKeys[priceType];
                const contentId = priceType + '-content';
                
                console.log('创建统计表格...');
                createStatsTable(descriptiveStats[key], contentId);
                
                console.log('创建时序图表...');
                createTimeSeriesChart(cleanedData, contentId, priceType);
                
                console.log('创建模型信息...');
                createModelInfo(contentId);
                
                console.log('创建评估表格...');
                createEvalTable(contentId);
                
                console.log('创建预测表格...');
                createForecastTable(contentId);
            });
            
            console.log('初始化完成');
        }

        // 页面加载完成后执行
        window.onload = init;
    </script>
</body>
</html>
