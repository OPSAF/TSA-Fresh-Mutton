<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试JSON加载</h1>
        <div id="test-results"></div>
    </div>

    <script>
        async function testJsonLoading() {
            const results = document.getElementById('test-results');
            results.innerHTML = '<div class="alert alert-info">正在加载JSON文件...</div>';

            try {
                // 测试cleaned_data.json
                const cleanedDataResp = await fetch('json_output/cleaned_data.json');
                if (cleanedDataResp.ok) {
                    const cleanedData = await cleanedDataResp.json();
                    results.innerHTML += '<div class="alert alert-success">cleaned_data.json 加载成功，数据长度: ' + cleanedData.length + '</div>';
                } else {
                    results.innerHTML += '<div class="alert alert-danger">cleaned_data.json 加载失败: ' + cleanedDataResp.status + '</div>';
                }

                // 测试forecast_results.json
                const forecastResp = await fetch('json_output/forecast_results.json');
                if (forecastResp.ok) {
                    const forecastData = await forecastResp.json();
                    results.innerHTML += '<div class="alert alert-success">forecast_results.json 加载成功</div>';
                } else {
                    results.innerHTML += '<div class="alert alert-danger">forecast_results.json 加载失败: ' + forecastResp.status + '</div>';
                }

            } catch (error) {
                results.innerHTML += '<div class="alert alert-danger">加载错误: ' + error.message + '</div>';
            }
        }

        window.onload = testJsonLoading;
    </script>
</body>
</html>
